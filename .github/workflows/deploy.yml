name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Manual/button-triggered runs pull fresh data from the sheet first.
      # Regular pushes (code changes) skip this and just deploy what's
      # already committed.
      - name: Refresh data from the source sheets
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install --quiet openpyxl
          # Each script runs independently — one source breaking (e.g. a
          # malformed cell, or a sheet's own formula/column getting deleted)
          # must not block the other 7 dashboards from refreshing. Before
          # 2026-10-26 this ran under plain `bash -e`, so a single crash in
          # fetch_aircall_data.py aborted the whole step and NOTHING
          # refreshed or deployed, for any page. `if ...; then` guards a
          # command from triggering errexit, so this loop survives any one
          # script failing.
          FAILED=""
          for script in \
            scripts/fetch_data.py \
            scripts/fetch_aircall_data.py \
            scripts/fetch_ar_data.py \
            scripts/fetch_facebook_ads.py \
            scripts/fetch_shipping_data.py \
            scripts/fetch_sales_report.py \
            scripts/fetch_paper_catalog.py \
            scripts/fetch_google_ads.py \
          ; do
            if python3 "$script"; then
              :
            else
              echo "##[error]$script failed — its data was NOT updated this run."
              FAILED="$FAILED $script"
            fi
          done

          DATA_FILES="src/data/ceoDashboardData.json src/data/aircallDashboardData.json src/data/arDashboardData.json src/data/facebookAdsData.json src/data/shippingData.json src/data/salesReportData.json src/data/paperCatalogData.json src/data/googleAdsData.json"
          if ! git diff --quiet -- $DATA_FILES; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $DATA_FILES
            git commit -m "Refresh dashboard data (automated)"
            git push
          else
            echo "No data changes since last refresh."
          fi

          if [ -n "$FAILED" ]; then
            echo "##[error]Refresh had failures, but continuing to build + deploy with whatever data DID update:$FAILED"
            exit 1
          fi

      # `!cancelled()` (not plain `always()`) below: run these even though
      # the refresh step above may have exited 1 for a failed source — a
      # partial data refresh still deserves a build+deploy for whichever
      # dashboards DID update, rather than skipping the rest of the job (the
      # pre-2026-10-26 behavior, which meant one broken source silently
      # blocked every dashboard's deploy, not just its own). Still skips if
      # someone actually cancels the run.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: dist

      # The custom-domain hub (terraslate.azdigitalph.com/ceo-dashboard/) is
      # a separate repo serving a static copy at a different base path —
      # GitHub Pages above doesn't touch it. Build again with that base and
      # push the copy straight into the hub repo so both stay in sync on
      # every refresh, not just on manual re-syncs.
      - name: Sync hub copy (terraslate.azdigitalph.com)
        if: ${{ !cancelled() }}
        env:
          HUB_REPO_TOKEN: ${{ secrets.HUB_REPO_TOKEN }}
        run: |
          npx vite build --base=/ceo-dashboard/ --outDir dist-hub
          git clone --depth 1 https://x-access-token:${HUB_REPO_TOKEN}@github.com/jayr-ai/terraslate-dashboard.git hub-repo
          rm -rf hub-repo/ceo-dashboard
          mkdir -p hub-repo/ceo-dashboard
          cp -r dist-hub/* hub-repo/ceo-dashboard/
          cd hub-repo
          python3 inject_gate.py ceo-dashboard/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ceo-dashboard
          if ! git diff --cached --quiet; then
            git commit -m "Sync CEO Dashboard: automated data refresh"
            git push
          else
            echo "Hub copy already up to date."
          fi

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
